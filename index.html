<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-9">
        <h4 class="text-center group-header">Group 2 Calculator</h4>
        <div class="card calculator-card">
          <div class="card-body p-4">
            <div class="calculator">

              <!-- Display -->
              <div class="display-container">
                <div class="mode-indicators">
                  <span id="shift-indicator" class="mode-badge shift-badge" style="display:none;">SHIFT</span>
                  <span id="alpha-indicator" class="mode-badge alpha-badge" style="display:none;">ALPHA</span>
                  <span id="hyp-indicator" class="mode-badge hyp-badge" style="display:none;">HYP</span>
                </div>
                <input type="text" class="form-control" id="result" placeholder="0" disabled />
              </div>

              <!-- Word Result Area -->
              <div class="word-display-area" id="word-area" style="display: none;">
                <div id="word-result"></div>
                <button id="speak-btn" onclick="speakResult()" disabled title="Speak Result">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.473 8.473 0 0 0-2.49-6.01l-.708.707A7.476 7.476 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303l.708.707z" />
                    <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.483 5.483 0 0 1 11.025 8a5.483 5.483 0 0 1-1.61 3.89l.706.706z" />
                    <path d="M8.707 11.182A4.486 4.486 0 0 0 10.025 8a4.486 4.486 0 0 0-1.318-3.182l-.707.707A3.489 3.489 0 0 1 9.025 8a3.489 3.489 0 0 1-1.025 2.475l.707.707z" />
                    <path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z" />
                  </svg>
                </button>
              </div>

              <!-- Language Selection -->
              <div class="language-selection mb-3">
                <label for="language-select" class="form-label small me-2">Language:</label>
                <select id="language-select" class="form-select form-select-sm" style="width: auto; display: inline-block;">
                  <option value="english">English</option>
                  <option value="hausa">Hausa</option>
                </select>
              </div>

              <!-- Steps Section -->
              <div class="steps-section mb-3">
                <h6>Steps</h6>
                <div id="steps" class="steps-container"></div>
              </div>

              <!-- BUTTON GRID -->
              <div class="btn-grid">

                <!-- Row 0: Mode buttons + Fraction + AC -->
                <button class="btn btn-shift" id="shift-btn" onclick="toggleShift()" title="SHIFT: unlocks inverse trig & extra functions">SHIFT</button>
                <button class="btn btn-alpha" id="alpha-btn" onclick="toggleAlpha()" title="ALPHA: insert constants (π, e, Ans)">ALPHA</button>
                <button class="btn btn-special" onclick="insertFraction()" title="Insert fraction (numerator/denominator)">
                  <span class="shift-label">a b/c</span>
                  <span class="main-label">n/d</span>
                </button>
                <button class="btn btn-action" onclick="clearResult()">AC</button>

                <!-- Row 1: Trig -->
                <button class="btn btn-trig" onclick="handleSin()" id="btn-sin">
                  <span class="shift-label">sin⁻¹</span>
                  <span class="main-label">sin</span>
                </button>
                <button class="btn btn-trig" onclick="handleCos()" id="btn-cos">
                  <span class="shift-label">cos⁻¹</span>
                  <span class="main-label">cos</span>
                </button>
                <button class="btn btn-trig" onclick="handleTan()" id="btn-tan">
                  <span class="shift-label">tan⁻¹</span>
                  <span class="main-label">tan</span>
                </button>
                <button class="btn btn-special" onclick="toggleHyp()" id="btn-hyp">
                  <span class="main-label">HYP</span>
                </button>

                <!-- Row 2: Brackets / Backspace / Dot -->
                <button class="btn btn-light" onclick="bracketToResult('(')">(</button>
                <button class="btn btn-light" onclick="bracketToResult(')')">)</button>
                <button class="btn btn-light" onclick="backspace()">←</button>
                <button class="btn btn-light" onclick="appendToResult('.')">.</button>

                <!-- Row 3: 7 8 9 / -->
                <button class="btn btn-light" onclick="appendToResult(7)">7</button>
                <button class="btn btn-light" onclick="appendToResult(8)">8</button>
                <button class="btn btn-light" onclick="appendToResult(9)">9</button>
                <button class="btn btn-operator" onclick="operatorToResult('/')">÷</button>

                <!-- Row 4: 4 5 6 * -->
                <button class="btn btn-light" onclick="appendToResult(4)">4</button>
                <button class="btn btn-light" onclick="appendToResult(5)">5</button>
                <button class="btn btn-light" onclick="appendToResult(6)">6</button>
                <button class="btn btn-operator" onclick="operatorToResult('*')">×</button>

                <!-- Row 5: 1 2 3 + -->
                <button class="btn btn-light" onclick="appendToResult(1)">1</button>
                <button class="btn btn-light" onclick="appendToResult(2)">2</button>
                <button class="btn btn-light" onclick="appendToResult(3)">3</button>
                <button class="btn btn-operator" onclick="operatorToResult('+')">+</button>

                <!-- Row 6: 0 0 - = -->
                <button class="btn btn-light zero-btn" onclick="appendToResult(0)">0</button>
                <button class="btn btn-light" onclick="appendToResult(0)">00</button>
                <button class="btn btn-operator" onclick="operatorToResult('-')">−</button>
                <button class="btn btn-equals" onclick="calculateResult()">=</button>

              </div>

              <!-- Angle Mode Toggle -->
              <div class="angle-mode mt-3">
                <span class="angle-label">Angle Mode:</span>
                <button class="angle-btn active" id="deg-btn" onclick="setAngleMode('deg')">DEG</button>
                <button class="angle-btn" id="rad-btn" onclick="setAngleMode('rad')">RAD</button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/bootstrap.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
